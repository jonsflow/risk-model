name: Update market data v2 (SQLite pipeline)

on:
  workflow_dispatch:
  schedule:
    # One cron per ET slot, updated by hand at each DST changeover. A previous
    # multi-cron + wall-time-gate version was tried and removed for complexity.
    # Currently set for EDT; shift both to 14:00 / 21:15 UTC when clocks go back.
    # Runs have started 4-5h late since GitHub's 2026-08-26 Actions incident.
    - cron: "0 13 * * 1-5"   # 09:00 ET
    - cron: "15 20 * * 1-5"  # 16:15 ET

permissions:
  contents: write

concurrency:
  group: update-data-v2
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance python-dotenv fredapi

      - name: Pull latest changes before modifying data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull --rebase origin ${{ github.ref_name }}

      - name: Seed SQLite from existing CSVs
        run: python3 -m pipeline.run seed

      - name: Fetch Yahoo Finance data → SQLite
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 -m pipeline.run fetch

      - name: Generate all caches from SQLite
        run: python3 -m pipeline.run generate

      - name: Commit and push cache data (if any)
        run: |
          git add data/cache/*.json data/cache/intraday/*.json data/fred/fred_cache.json data/last_updated.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update caches (v2 pipeline)"
          git push
